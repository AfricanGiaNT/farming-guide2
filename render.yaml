services:
  - type: web
    name: mlangizi-wa-ulimi
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    startCommand: python api_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 18.18.0
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 8000
      # Add your environment variables here
      # These should be set in Render dashboard for security
      - key: OPENWEATHERMAP_API_KEY
        sync: false  # Set in dashboard
      - key: OPENAI_API_KEY
        sync: false  # Set in dashboard
      - key: SUPABASE_URL
        sync: false  # Set in dashboard
      - key: SUPABASE_KEY
        sync: false  # Set in dashboard
      - key: DATABASE_URL
        sync: false  # Set in dashboard (if using PostgreSQL)

